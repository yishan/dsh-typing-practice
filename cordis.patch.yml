# typing-practice: a timed typing test page in the DSH sidebar.
#
# The bundle inserts one host row. That row registers no services and has no
# configuration: practice text generation, timing and the local best score all
# run in the Client half, which package.json declares through `dsh.client`.
# The Client half adds a `sidebar.panellist` entry and its `main` page.
- insert:
    - id: typing-practice
      name: typing-practice
      config: {}
